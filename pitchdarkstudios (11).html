<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pitch Dark Studios</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%; height: 100%;
  background: #000;
  overflow: hidden;
  font-family: 'Cormorant Garamond', serif;
}

/* Grain overlay */
#grain {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 900;
  opacity: 0.03;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size: 200px;
}

/* Wordmark */
#wordmark {
  position: fixed;
  top: 30px;
  left: 50%;
  transform: translateX(-50%);
  font-weight: 300;
  font-size: 10px;
  letter-spacing: 0.6em;
  color: rgba(201,146,58,0.1);
  text-transform: uppercase;
  pointer-events: none;
  white-space: nowrap;
  z-index: 50;
}

/* Hint */
#hint {
  position: fixed;
  bottom: 34px;
  left: 50%;
  transform: translateX(-50%);
  font-style: italic;
  font-size: 11px;
  letter-spacing: 0.35em;
  color: rgba(201,146,58,0.18);
  pointer-events: none;
  white-space: nowrap;
  z-index: 50;
  transition: opacity 1s ease;
}
#hint.hidden { opacity: 0; }

/* Escape hint */
#esc-hint {
  position: fixed;
  bottom: 34px;
  left: 50%;
  transform: translateX(-50%);
  font-style: italic;
  font-size: 11px;
  letter-spacing: 0.3em;
  color: rgba(201,146,58,0.2);
  pointer-events: none;
  white-space: nowrap;
  z-index: 50;
  opacity: 0;
  transition: opacity 0.5s ease;
}
#esc-hint.visible { opacity: 1; }

/* Pulse */
#pulse {
  position: fixed;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #c9923a;
  z-index: 150;
  box-shadow: 0 0 6px rgba(201,146,58,0.5), 0 0 20px rgba(201,146,58,0.15);
  animation: pulse 4s ease-in-out infinite;
  cursor: pointer;
}
#pulse::after {
  content: '';
  position: absolute;
  inset: -24px;
  border-radius: 50%;
}
@keyframes pulse {
  0%, 100% { transform: translate(-50%, -50%) scale(0.85); opacity: 0.5; box-shadow: 0 0 4px rgba(201,146,58,0.4), 0 0 12px rgba(201,146,58,0.1); }
  50%       { transform: translate(-50%, -50%) scale(1.15); opacity: 1;   box-shadow: 0 0 8px rgba(201,146,58,0.7), 0 0 30px rgba(201,146,58,0.2); }
}

/* Overlay for dimming when expanded */
#overlay {
  position: fixed;
  inset: 0;
  background: transparent;
  z-index: 300;
  pointer-events: none;
  transition: background 0.5s ease;
}
#overlay.active {
  background: rgba(0,0,0,0.65);
  pointer-events: all;
}

/* Petals */
.petal {
  position: fixed;
  background: rgba(4,2,0,0.95);
  border: 1px solid rgba(201,146,58,0.08);
  border-radius: 2px;
  overflow: hidden;
  z-index: 400;
  cursor: pointer;

  /* Start invisible and scaled to centre */
  opacity: 0;
  pointer-events: none;
  transform: scale(0);
}

.petal.open {
  pointer-events: all;
}

.petal:hover {
  border-color: rgba(201,146,58,0.25);
  box-shadow: 0 0 16px rgba(201,146,58,0.07);
}

.petal.expanded {
  border-color: rgba(201,146,58,0.4);
  box-shadow: 0 0 50px rgba(201,146,58,0.1), inset 0 0 30px rgba(201,146,58,0.04);
  z-index: 600;
}

.petal-glow {
  position: absolute;
  inset: 0;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.5s ease;
}
.petal.expanded .petal-glow { opacity: 1; }

.petal-inner {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 12px;
}

.petal-symbol {
  font-size: 20px;
  color: rgba(201,146,58,0.5);
  margin-bottom: 6px;
  line-height: 1;
  transition: font-size 0.5s ease, color 0.4s ease;
}
.petal.expanded .petal-symbol {
  font-size: 42px;
  color: rgba(201,146,58,0.9);
}

.petal-name {
  font-weight: 300;
  font-size: 9px;
  letter-spacing: 0.28em;
  color: rgba(201,146,58,0.35);
  text-transform: uppercase;
  text-align: center;
  transition: font-size 0.5s ease, color 0.4s ease, letter-spacing 0.5s ease;
}
.petal.expanded .petal-name {
  font-size: 12px;
  letter-spacing: 0.42em;
  color: rgba(201,146,58,0.65);
}
</style>
</head>
<body>

<div id="grain"></div>
<div id="wordmark">Pitch Dark Studios</div>
<div id="hint">approach the light</div>
<div id="esc-hint">click to return</div>
<div id="overlay"></div>
<div id="pulse"></div>

<script>
const VW = window.innerWidth;
const VH = window.innerHeight;
const CX = VW / 2;
const CY = VH / 2;

// Petal definitions
// ox/oy = offset from centre as % of viewport
// delay = ms before this petal starts opening (staggered bloom)
// dur   = ms for the open animation
const PETALS = [
  { name: "Pitch Dark Press",  symbol: "✦", ox: -28, oy: -22, w: 155, h: 106, delay: 0,    dur: 2000, href: "https://www.pitchdarkpress.com",        lc: "rgba(110,18,18,0.4)"   },
  { name: "Proauthorist",      symbol: "∞", ox:  28, oy: -14, w: 126, h:  86, delay: 300,  dur: 1900, href: "https://www.proauthorist.com",           lc: "rgba(75,18,120,0.36)"  },
  { name: "InkySwot",          symbol: "◈", ox:  20, oy: -30, w: 136, h:  92, delay: 580,  dur: 2000, href: "https://app.inkyswot.com",               lc: "rgba(170,110,25,0.4)"  },
  { name: "Publishing",        symbol: "⊞", ox:  34, oy:  17, w: 146, h:  96, delay: 840,  dur: 1950, href: "#",                                      lc: "rgba(18,75,28,0.36)"   },
  { name: "Broadcasting",      symbol: "⊙", ox: -40, oy:   7, w: 116, h: 126, delay: 1100, dur: 2000, href: "https://www.pitchdarkbroadcasting.com",  lc: "rgba(18,45,120,0.4)"   },
  { name: "Contact",           symbol: "◎", ox:  -6, oy: -30, w: 114, h:  84, delay: 1340, dur: 1850, href: "#",                                      lc: "rgba(55,52,38,0.36)"   },
  { name: "News",              symbol: "◈", ox:  14, oy:  30, w: 130, h:  88, delay: 1580, dur: 2000, href: "#",                                      lc: "rgba(95,65,18,0.36)"   },
  { name: "Login",             symbol: "▷", ox:  40, oy:  -4, w: 102, h:  90, delay: 1820, dur: 1900, href: "#",                                      lc: "rgba(22,22,22,0.5)"    },
  { name: "R&D",               symbol: "◬", ox: -14, oy:  34, w: 106, h: 116, delay: 2060, dur: 2000, href: "#",                                      lc: "rgba(160,160,140,0.18)"},
  { name: "Pitch Dark Studios", symbol: "◌", ox: -24, oy: -38, w:  96, h:  82, delay: 2300, dur: 1950, href: "#",                                      lc: "rgba(115,85,18,0.34)"  },
];

// Compute absolute positions
const pData = PETALS.map(p => ({
  ...p,
  px: CX + (p.ox / 100) * VW,
  py: CY + (p.oy / 100) * VH,
}));

// Build petal elements
const petalEls = pData.map((p, i) => {
  const el        = document.createElement('div');
  el.className    = 'petal';
  el.dataset.idx  = i;

  const natLeft = p.px - p.w / 2;
  const natTop  = p.py - p.h / 2;

  // Position and scale from centre outward
  el.style.left            = natLeft + 'px';
  el.style.top             = natTop  + 'px';
  el.style.width           = p.w     + 'px';
  el.style.height          = p.h     + 'px';
  el.style.transformOrigin = (CX - natLeft) + 'px ' + (CY - natTop) + 'px';
  el.style.transform       = 'scale(0)';
  el.style.opacity         = '0';

  // Glow
  const glow = document.createElement('div');
  glow.className = 'petal-glow';
  glow.style.background = `radial-gradient(ellipse at center, ${p.lc} 0%, transparent 70%)`;

  // Inner
  const inner = document.createElement('div');
  inner.className = 'petal-inner';

  const sym  = document.createElement('div');
  sym.className   = 'petal-symbol';
  sym.textContent = p.symbol;

  const name = document.createElement('div');
  name.className   = 'petal-name';
  name.textContent = p.name;

  inner.appendChild(sym);
  inner.appendChild(name);
  el.appendChild(glow);
  el.appendChild(inner);
  document.body.appendChild(el);

  // Store natural position for collapse
  el._nat  = { left: natLeft, top: natTop, w: p.w, h: p.h };
  el._href = p.href;

  return el;
});

// ── STATE ─────────────────────────────────────────────────────────────────
let isOpen      = false;
let expandedIdx = null;

// ── OPEN ALL ──────────────────────────────────────────────────────────────
function openAll() {
  isOpen = true;
  document.getElementById('hint').classList.add('hidden');

  pData.forEach((p, i) => {
    const el = petalEls[i];
    setTimeout(() => {
      el.style.transition = `transform ${p.dur}ms cubic-bezier(0.12,1.2,0.3,1), opacity 600ms ease`;
      el.style.transform  = 'scale(1)';
      el.style.opacity    = '1';
      el.classList.add('open');
    }, p.delay);
  });
}

// ── EXPAND ONE PETAL ──────────────────────────────────────────────────────
function expandPetal(idx) {
  if (expandedIdx === idx) return;
  expandedIdx = idx;

  document.getElementById('pulse').style.cssText += '; opacity:0; transition: opacity 0.3s ease;';
  document.getElementById('overlay').classList.add('active');
  document.getElementById('esc-hint').classList.add('visible');

  const ew = Math.min(VW * 0.38, 480);
  const eh = Math.min(VH * 0.40, 360);

  petalEls.forEach((el, i) => {
    if (i === idx) {
      el.style.transition = 'left 0.85s cubic-bezier(0.16,1.1,0.3,1), top 0.85s cubic-bezier(0.16,1.1,0.3,1), width 0.85s cubic-bezier(0.16,1.1,0.3,1), height 0.85s cubic-bezier(0.16,1.1,0.3,1), border-color 0.4s, box-shadow 0.4s';
      el.style.left   = (CX - ew / 2) + 'px';
      el.style.top    = (CY - eh / 2) + 'px';
      el.style.width  = ew + 'px';
      el.style.height = eh + 'px';
      el.classList.add('expanded');
    } else {
      el.style.transition = 'opacity 0.3s ease';
      el.style.opacity    = '0';
      el.style.pointerEvents = 'none';
    }
  });
}

// ── COLLAPSE BACK TO CONSTELLATION ────────────────────────────────────────
function collapseAll() {
  if (expandedIdx === null) return;
  expandedIdx = null;

  document.getElementById('pulse').style.opacity = '1';
  document.getElementById('overlay').classList.remove('active');
  document.getElementById('esc-hint').classList.remove('visible');

  petalEls.forEach((el, i) => {
    const n = el._nat;
    el.style.transition    = 'left 0.75s cubic-bezier(0.16,1.1,0.3,1), top 0.75s cubic-bezier(0.16,1.1,0.3,1), width 0.75s cubic-bezier(0.16,1.1,0.3,1), height 0.75s cubic-bezier(0.16,1.1,0.3,1), opacity 0.4s ease, border-color 0.4s, box-shadow 0.4s';
    el.style.left          = n.left + 'px';
    el.style.top           = n.top  + 'px';
    el.style.width         = n.w    + 'px';
    el.style.height        = n.h    + 'px';
    el.style.opacity       = '1';
    el.style.pointerEvents = '';
    el.classList.remove('expanded');
  });
}

// ── PULSE CLICK — open or fade to black then reset ───────────────────────
document.getElementById('pulse').addEventListener('click', () => {
  if (!isOpen) {
    openAll();
  } else {
    // Fade to black then reload
    const fade = document.createElement('div');
    fade.style.cssText = 'position:fixed;inset:0;background:#000;opacity:0;z-index:9999;transition:opacity 0.8s ease;pointer-events:none;';
    document.body.appendChild(fade);
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        fade.style.opacity = '1';
        setTimeout(() => location.reload(), 850);
      });
    });
  }
});

// ── PETAL CLICKS ──────────────────────────────────────────────────────────
document.body.addEventListener('click', e => {
  const petal = e.target.closest('.petal');
  if (!petal) return;

  const idx = parseInt(petal.dataset.idx);
  if (expandedIdx === idx) {
    const href = petal._href;
    if (href && href !== '#') window.open(href, '_blank');
  } else {
    expandPetal(idx);
  }
});

// ── OVERLAY CLICK — collapse expanded petal ───────────────────────────────
document.getElementById('overlay').addEventListener('click', e => {
  e.stopPropagation();
  collapseAll();
});

// ── ESCAPE KEY ────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') collapseAll();
});
</script>
</body>
</html>
