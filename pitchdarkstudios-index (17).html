<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pitch Dark Studios</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    cursor: none;
    font-family: 'Cormorant Garamond', serif;
  }

  #cursor {
    position: fixed;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: rgba(201,146,58,0.85);
    pointer-events: none;
    z-index: 9999;
    left: -20px; top: -20px;
    transform: translate(-50%, -50%);
    transition: width 0.25s ease, height 0.25s ease;
    box-shadow: 0 0 6px rgba(201,146,58,0.5);
    mix-blend-mode: screen;
  }
  #cursor.near { width: 18px; height: 18px; }

  #pulse {
    position: fixed;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: 60px; height: 60px;
    border-radius: 50%;
    background: transparent;
    z-index: 700;
    cursor: none;
  }

  #pulse-dot {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #c9923a;
    box-shadow: 0 0 4px rgba(201,146,58,0.4);
    animation: gentlePulse 4s ease-in-out infinite;
    pointer-events: none;
  }
  #pulse-dot::before {
    content: '';
    position: absolute;
    inset: -8px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(201,146,58,0.13) 0%, transparent 70%);
    animation: gentlePulse 4s ease-in-out infinite 0.5s;
  }
  #pulse-dot::after {
    content: '';
    position: absolute;
    inset: -20px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(201,146,58,0.05) 0%, transparent 70%);
    animation: gentlePulse 4s ease-in-out infinite 1s;
  }
  @keyframes gentlePulse {
    0%   { opacity: 0.4; transform: scale(0.85); }
    50%  { opacity: 1;   transform: scale(1.15); }
    100% { opacity: 0.4; transform: scale(0.85); }
  }

  #lines-svg { display: none; }

  .root-line {
    fill: none;
    stroke: rgba(201,146,58,0.18);
    stroke-width: 0.5;
    opacity: 0;
  }
  .root-line.faded  { opacity: 0.03; }
  .root-line.focused { stroke: rgba(201,146,58,0.5); stroke-width: 0.9; }

  .petal {
    position: fixed;
    border-radius: 2px;
    background: rgba(5,3,1,0.95);
    border: 1px solid rgba(201,146,58,0.07);
    overflow: hidden;
    opacity: 0;
    pointer-events: none;
    backdrop-filter: blur(16px);
    z-index: 50;
    transition: border-color 0.4s, box-shadow 0.4s, opacity 0.6s ease;
  }
  .petal.open {
    opacity: 1;
    pointer-events: all;
    cursor: none;
  }
  .petal.collapsed {
    opacity: 0 !important;
    pointer-events: none !important;
    transition: opacity 0.35s ease !important;
  }
  .petal.expanded {
    border-color: rgba(201,146,58,0.35);
    box-shadow: 0 0 50px rgba(201,146,58,0.09), inset 0 0 30px rgba(201,146,58,0.03);
    z-index: 600 !important;
  }
  .petal:not(.expanded):hover {
    border-color: rgba(201,146,58,0.22);
    box-shadow: 0 0 12px rgba(201,146,58,0.06);
  }

  .petal-inner {
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 14px;
    position: relative;
  }

  .petal-symbol {
    font-size: 20px;
    color: rgba(201,146,58,0.5);
    margin-bottom: 7px;
    line-height: 1;
    filter: drop-shadow(0 0 3px rgba(201,146,58,0.2));
    transition: color 0.4s, filter 0.4s, font-size 0.5s;
  }
  .petal.expanded .petal-symbol {
    font-size: 44px;
    color: rgba(201,146,58,0.92);
    filter: drop-shadow(0 0 16px rgba(201,146,58,0.65));
    margin-bottom: 14px;
  }

  .petal-name {
    font-weight: 300;
    font-size: 9px;
    letter-spacing: 0.26em;
    color: rgba(201,146,58,0.35);
    text-transform: uppercase;
    text-align: center;
    transition: color 0.4s, font-size 0.5s, letter-spacing 0.5s;
  }
  .petal.expanded .petal-name {
    font-size: 12px;
    letter-spacing: 0.4em;
    color: rgba(201,146,58,0.65);
  }

  .petal-glow {
    position: absolute;
    inset: 0;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s;
  }
  .petal.expanded .petal-glow { opacity: 1; }

  #overlay {
    position: fixed;
    inset: 0;
    background: transparent;
    z-index: 400;
    pointer-events: none;
    transition: background 0.5s;
  }
  #overlay.active {
    background: rgba(0,0,0,0.62);
    pointer-events: all;
  }

  #grain {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 800;
    opacity: 0.028;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 256px;
  }

  #hint {
    position: fixed;
    bottom: 36px;
    left: 50%;
    transform: translateX(-50%);
    font-style: italic;
    font-size: 11px;
    letter-spacing: 0.35em;
    color: rgba(201,146,58,0.18);
    pointer-events: none;
    transition: opacity 1.4s;
    white-space: nowrap;
    z-index: 50;
  }
  #hint.gone { opacity: 0; }

  #wordmark {
    position: fixed;
    top: 32px;
    left: 50%;
    transform: translateX(-50%);
    font-weight: 300;
    font-size: 10px;
    letter-spacing: 0.6em;
    color: rgba(201,146,58,0.09);
    text-transform: uppercase;
    pointer-events: none;
    white-space: nowrap;
    z-index: 50;
  }

  #esc-hint {
    position: fixed;
    bottom: 36px;
    left: 50%;
    transform: translateX(-50%);
    font-style: italic;
    font-size: 11px;
    letter-spacing: 0.3em;
    color: rgba(201,146,58,0.22);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.5s;
    white-space: nowrap;
    z-index: 900;
  }
  #esc-hint.show { opacity: 1; }
</style>
</head>
<body>

<div id="cursor"></div>
<div id="grain"></div>
<div id="overlay"></div>
<svg id="lines-svg" xmlns="http://www.w3.org/2000/svg"></svg>

<div id="wordmark">Pitch Dark Studios</div>
<div id="hint">approach the light</div>
<div id="esc-hint">click anywhere to return</div>
<div id="pulse"><div id="pulse-dot"></div></div>

<script>
const VW = window.innerWidth;
const VH = window.innerHeight;
const CX = VW / 2;
const CY = VH / 2;

const PETALS = [
  { name:"Pitch Dark Press",  symbol:"✦", ox:-28, oy:-22, w:155, h:106, delay:0,    dur:2200, href:"https://www.pitchdarkpress.com",        lc:"rgba(110,18,18,0.38)" },
  { name:"Proauthorist",      symbol:"∞", ox:28,  oy:-14, w:126, h:86,  delay:300,  dur:2000, href:"https://www.proauthorist.com",          lc:"rgba(75,18,120,0.36)" },
  { name:"InkySwot",          symbol:"◈", ox:20,  oy:-30, w:136, h:92,  delay:580,  dur:2100, href:"https://app.inkyswot.com",              lc:"rgba(170,110,25,0.38)" },
  { name:"Publishing",        symbol:"⊞", ox:34,  oy:17,  w:146, h:96,  delay:840,  dur:2000, href:"#",                                     lc:"rgba(18,75,28,0.36)" },
  { name:"Broadcasting",      symbol:"⊙", ox:-40, oy:7,   w:116, h:126, delay:1100, dur:2200, href:"https://www.pitchdarkbroadcasting.com", lc:"rgba(18,45,120,0.38)" },
  { name:"Contact",           symbol:"◎", ox:-6,  oy:-30, w:114, h:84,  delay:1360, dur:1900, href:"#",                                     lc:"rgba(55,52,38,0.36)" },
  { name:"The Manifest",      symbol:"≡", ox:14,  oy:30,  w:130, h:88,  delay:1600, dur:2100, href:"#",                                     lc:"rgba(95,65,18,0.36)" },
  { name:"Login",             symbol:"▷", ox:40,  oy:-4,  w:102, h:90,  delay:1840, dur:2000, href:"#",                                     lc:"rgba(22,22,22,0.5)" },
  { name:"R&D",               symbol:"◬", ox:-14, oy:34,  w:106, h:116, delay:2080, dur:2200, href:"#",                                     lc:"rgba(160,160,140,0.16)" },
  { name:"The Signal",        symbol:"◌", ox:-24, oy:-38, w:96,  h:82,  delay:2320, dur:2100, href:"#",                                     lc:"rgba(115,85,18,0.34)" },
];

const pData = PETALS.map(p => ({
  ...p,
  px: CX + (p.ox / 100 * VW),
  py: CY + (p.oy / 100 * VH),
}));

// SVG lines — opacity only, no dash animation
const svg = document.getElementById('lines-svg');
const lineEls = pData.map((p, i) => {
  const el = document.createElementNS('http://www.w3.org/2000/svg','path');
  el.setAttribute('class', 'root-line');
  const side = (i % 2 === 0) ? 1 : -1;
  const cpx = CX + (p.px - CX) * 0.5 + side * 16;
  const cpy = CY + (p.py - CY) * 0.5 + (i % 3 === 0 ? -12 : 12);
  el.setAttribute('d', `M${CX},${CY} Q${cpx},${cpy} ${p.px},${p.py}`);
  el.style.opacity = '0';
  svg.appendChild(el);
  return el;
});

// Petal elements
const petalEls = pData.map((p, i) => {
  const el = document.createElement('div');
  el.className = 'petal';
  el.dataset.idx = i;

  const natLeft = p.px - p.w / 2;
  const natTop  = p.py - p.h / 2;
  const origX   = CX - natLeft;
  const origY   = CY - natTop;

  el.style.cssText = `
    left:${natLeft}px; top:${natTop}px;
    width:${p.w}px; height:${p.h}px;
    transform: scale(0);
    transform-origin: ${origX}px ${origY}px;
    transition: transform ${p.dur}ms cubic-bezier(0.12,1.2,0.3,1) ${p.delay}ms,
                opacity 0.8s ease ${p.delay}ms,
                border-color 0.4s, box-shadow 0.4s;
  `;

  const glow = document.createElement('div');
  glow.className = 'petal-glow';
  glow.style.background = `radial-gradient(ellipse at center, ${p.lc} 0%, transparent 70%)`;

  const inner = document.createElement('div');
  inner.className = 'petal-inner';

  const sym = document.createElement('div');
  sym.className = 'petal-symbol';
  sym.textContent = p.symbol;

  const name = document.createElement('div');
  name.className = 'petal-name';
  name.textContent = p.name;

  inner.appendChild(sym);
  inner.appendChild(name);
  el.appendChild(glow);
  el.appendChild(inner);
  document.body.appendChild(el);

  el._nat   = { left: natLeft, top: natTop, w: p.w, h: p.h };
  el._href  = p.href;
  el._line  = lineEls[i];

  return el;
});

// ─── STATE ────────────────────────────────────────────────────────────────
let opened      = false;
let expandedIdx = null;
let wasAway     = false;

// ─── CURSOR — direct tracking, no lag ────────────────────────────────────
const cursorEl = document.getElementById('cursor');

document.addEventListener('mousemove', e => {
  cursorEl.style.left = e.clientX + 'px';
  cursorEl.style.top  = e.clientY + 'px';

  const d = Math.hypot(e.clientX - CX, e.clientY - CY);
  cursorEl.classList.toggle('near', d < 70);

  if (d < 12 && !opened) {
    openAll();
  }
  wasAway = d > 20;
});

// ─── OPEN ALL ─────────────────────────────────────────────────────────────
function openAll() {
  opened = true;
  document.getElementById('hint').classList.add('gone');

  petalEls.forEach((el, i) => {
    el.style.opacity = '';
    el.style.pointerEvents = '';
    el.style.transition = `transform ${pData[i].dur}ms cubic-bezier(0.12,1.2,0.3,1) ${pData[i].delay}ms, opacity 0.8s ease ${pData[i].delay}ms, border-color 0.4s, box-shadow 0.4s`;
    el.style.transform = 'scale(1)';
    el.classList.add('open');

    const lDelay = pData[i].delay + 200;
    lineEls[i].style.transition = `opacity 0.8s ease ${lDelay}ms`;
    lineEls[i].style.opacity = '1';
    lineEls[i].classList.remove('faded');
  });
}

// ─── CLOSE ALL (hover back to light) ──────────────────────────────────────
function closeAll() {
  opened = false;
  petalEls.forEach((el, i) => {
    el.style.transition = `transform 700ms cubic-bezier(0.4,0,0.6,1), opacity 500ms ease`;
    el.style.transform = 'scale(0)';
    el.style.opacity = '0';
    el.style.pointerEvents = 'none';
  });
}

// ─── EXPAND ───────────────────────────────────────────────────────────────
function expandPetal(idx) {
  expandedIdx = idx;
  document.getElementById('overlay').classList.add('active');
  document.getElementById('esc-hint').classList.add('show');

  const ew = Math.min(VW * 0.36, 460);
  const eh = Math.min(VH * 0.38, 350);

  petalEls.forEach((el, i) => {
    if (i === idx) {
      el.style.transition = 'left 0.9s cubic-bezier(0.16,1.1,0.3,1), top 0.9s cubic-bezier(0.16,1.1,0.3,1), width 0.9s cubic-bezier(0.16,1.1,0.3,1), height 0.9s cubic-bezier(0.16,1.1,0.3,1), border-color 0.4s, box-shadow 0.4s, opacity 0.4s';
      el.style.left   = (CX - ew / 2) + 'px';
      el.style.top    = (CY - eh / 2) + 'px';
      el.style.width  = ew + 'px';
      el.style.height = eh + 'px';
      el.classList.add('expanded');
      el._line.classList.add('focused');
      el._line.classList.remove('faded');
    } else {
      el.classList.add('collapsed');
      el._line.classList.add('faded');
      el._line.classList.remove('focused');
    }
  });
}

// ─── COLLAPSE ─────────────────────────────────────────────────────────────
function collapseAll() {
  if (expandedIdx === null) return;
  expandedIdx = null;
  document.getElementById('overlay').classList.remove('active');
  document.getElementById('esc-hint').classList.remove('show');

  petalEls.forEach((el, i) => {
    const n = el._nat;
    el.style.transition = 'left 0.75s cubic-bezier(0.16,1.1,0.3,1), top 0.75s cubic-bezier(0.16,1.1,0.3,1), width 0.75s cubic-bezier(0.16,1.1,0.3,1), height 0.75s cubic-bezier(0.16,1.1,0.3,1), opacity 0.4s, border-color 0.4s, box-shadow 0.4s';
    el.style.left   = n.left + 'px';
    el.style.top    = n.top  + 'px';
    el.style.width  = n.w   + 'px';
    el.style.height = n.h   + 'px';
    el.style.zIndex = '';
    el.classList.remove('expanded','collapsed');
    el._line.classList.remove('faded','focused');
    el._line.classList.add('drawn');
  });
}

// ─── PULSE HOVER — close petals when returning to light ───────────────────
document.getElementById('pulse').addEventListener('mouseenter', () => {
  if (opened && expandedIdx === null) closeAll();
});

// ─── PULSE HOVER — reload page when returning to light ────────────────────
document.getElementById('pulse').addEventListener('mouseenter', () => {
  if (opened && expandedIdx === null) location.reload();
});

// ─── CLICKS ───────────────────────────────────────────────────────────────
document.body.addEventListener('click', e => {
  const petal = e.target.closest('.petal');
  if (!petal) { collapseAll(); return; }
  const idx = parseInt(petal.dataset.idx);
  if (expandedIdx === idx) {
    if (petal._href && petal._href !== '#') window.open(petal._href, '_blank');
  } else {
    expandPetal(idx);
  }
});

document.getElementById('overlay').addEventListener('click', e => { e.stopPropagation(); collapseAll(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') collapseAll(); });
</script>
</body>
</html>
